<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhysioMap | Interactive Muscle Trainer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="app-layout">
        <!-- Sidebar: Navigation & Filters -->
        <nav class="sidebar">
            <div class="brand">
                <h1>Physio<span class="text-primary">Map</span></h1>
            </div>

            <div class="sidebar-section">
                <h2>MUSCLES</h2>
                <div class="search-wrapper">
                    <input type="text" id="search-input" placeholder="Rechercher un muscle...">
                </div>
                <ul id="muscle-list" class="nav-list">
                    <li class="loading">Chargement...</li>
                </ul>
            </div>
        </nav>

        <!-- Main Stage: Interactive Body Map -->
        <main class="main-stage">
            <header class="stage-header">
                <div class="breadcrumbs">Anatomie > <strong>Carte Interactive</strong></div>
            </header>

            <div class="canvas-viewport">
                <!-- FRONT VIEW (Left) -->
                <div class="anatomy-figure">
                    <span class="figure-label">VUE AVANT</span>
                    <div class="body-container" id="container-front" data-view="front">
                        <canvas id="canvas-front" class="body-canvas"></canvas>
                    </div>
                </div>

                <!-- BACK VIEW (Right) -->
                <div class="anatomy-figure">
                    <span class="figure-label">VUE ARRIÈRE</span>
                    <div class="body-container" id="container-back" data-view="back">
                        <canvas id="canvas-back" class="body-canvas"></canvas>
                    </div>
                </div>

                <!-- Tooltip -->
                <div id="tooltip" class="tooltip"></div>
            </div>
        </main>

        <!-- Right Panel: Exercise Feed -->
        <aside class="details-panel">
            <div class="panel-header">
                <h2 id="feed-title">Sélectionnez un muscle</h2>
            </div>
            <div id="exercise-feed" class="feed-content">
                <div class="empty-state">
                    <div class="empty-icon">👈</div>
                    <p>Cliquez sur un groupe musculaire pour voir les exercices.</p>
                </div>
            </div>
        </aside>
    </div>

    <!-- Scripts: muscle-assets.js MUST load first -->
    <script src="muscle-assets.js"></script>
    <script src="app.js"></script>
</body>

</html>
